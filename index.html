<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Momentum Harmonograph</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="nav-tabs">
<button class="tab-btn active">World Cup Momentum Harmonograph</button>
</div>

<div id="workspace">
<div id="sidebar">
<div class="tab-panel active">
<h3>Select World Cup Match</h3>
<div class="control-group">
<select id="match-select" class="dropdown-input" onchange="loadAndPlayMatch(
this.value)">

<option value="final">Final: Spain 1–0 Argentina (A.E.T.)</option>
<option value="third">3rd Place: England 6–4 France</option>
<option value="capeverde">R32: Argentina 3–2 Cape Verde (A.E.T.)</option>
<option value="semifinal">Semifinal: England 1–2 Argentina</option>
<option value="r16_mexico">R16: Mexico 2–3 England</option>
</select>
</div>

<!-- Match Speed Slider -->
<div class="control-group speed-group">
<div class="control-header">
<span>Match Simulation Speed</span>
<span class="control-val" id="speed-val">1.0x</span>
</div>
<input type="range" id="speed-slider" min="0.1" max="3.0" step="0.1" value="1.0">
</div>

<!-- Live Match Telemetry Display -->
<div class="telemetry-card">
<div class="telemetry-header">
<span id="match-title">Spain vs Argentina</span>
<span id="match-minute" class="minute-badge">00'</span>
</div>
<div class="momentum-bar-container">
<div class="momentum-label"><span>Home Momentum</span><span id="home-val">50%</span></div>
<div class="bar-bg"><div id="home-bar" class="bar-fill home" style="width: 50%;"></div></div>
</div>
<div class="momentum-bar-container">
<div class="momentum-label"><span>Away Momentum</span><span id="away-val">50%</span></div>
<div class="bar-bg"><div id="away-bar" class="bar-fill away" style="width: 50%;"></div></div>
</div>
<div class="match-event" id="match-event-text">Kick-off</div>
</div>

<div class="info-box">
<p><strong>Harmonograph Physics:</strong> Amplitudes (Ax, Ay) expand based on team momentum. Phase angle shifts (phi) dynamically twist the canvas loops whenever control shifts.</p>
</div>
</div>

<div class="action-tray">
<button class="btn btn-secondary" id="pause-btn">Pause</button>
<button class="btn btn-primary" id="replay-btn">Replay Match Trace</button>
</div>
</div>

<div id="viewport">
<canvas id="artCanvas" width="800" height="800"></canvas>
</div>
</div>

<script src="app.js"></script>
</body>
</html>
